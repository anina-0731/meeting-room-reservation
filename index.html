<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议室预定与课程场地记录日历 - 智能定制版</title>
    <style>
        /* ==========================================================================
           1. 全局样式与科技蓝高级色系
           ========================================================================= */
        :root {
            --primary-color: #1e3a8a;        /* 深科技蓝 */
            --primary-light: #3b82f6;       /* 明亮天蓝 */
            --bg-color: #f0f4f8;            /* 浅淡蓝灰背景 */
            --card-bg: #ffffff;             /* 纯白卡片 */
            --text-color: #1e293b;          /* 深蓝黑文字 */
            --border-color: #cbd5e1;        /* 细腻边框线 */
            --sidebar-width: 380px;

            /* 核心业务颜色配置 */
            --color-need-book: #fef2f2;      /* 待预定：淡粉红 */
            --color-need-book-text: #ef4444; 
            
            --color-23-meet: #eff6ff;        /* 23F 会议室：冰蓝 */
            --color-23-meet-text: #2563eb;
            --color-23-chat: #ecfdf5;        /* 23F 洽谈室：薄荷绿 */
            --color-23-chat-text: #059669;
            
            --color-27-meet: #f0fdf4;        /* 27F 会议室：翠绿 */
            --color-27-meet-text: #16a34a;
            --color-27-chat: #faf5ff;        /* 27F 洽谈室：薰衣草紫 */
            --color-27-chat-text: #7c3aed;

            --color-28-meet: #f1f5f9;        /* 28F 会议室：高级灰蓝 */
            --color-28-meet-text: #475569;
            --color-28-chat: #e0f2fe;        /* 28F 洽谈室：深湖蓝 */
            --color-28-chat-text: #0369a1;
            
            --color-32-road: #fff7ed;        /* 32F 路演厅：琥珀橙 */
            --color-32-road-text: #ea580c;

            --color-custom: #f8fafc;          /* 自定义房间：百搭浅灰 */
            --color-custom-text: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ==========================================================================
           2. 左侧侧边栏样式
           ========================================================================= */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 4px 0 15px rgba(30, 58, 138, 0.05);
        }
        .sidebar-header {
            padding: 24px 20px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .sidebar-header h2 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px;}
        .sidebar-header p { font-size: 12px; color: #bfdbfe; margin-top: 6px; opacity: 0.9; }

        .backup-toolbar {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        .btn-backup {
            flex: 1; padding: 8px; font-size: 12px; background: rgba(255, 255, 255, 0.15); color: white; 
            border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px; cursor: pointer; font-weight: 600;
            text-align: center; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .btn-backup:hover { background: rgba(255, 255, 255, 0.3); border-color: white; transform: translateY(-1px); }

        .form-container { padding: 20px; overflow-y: auto; flex: 1; background: #f8fafc;}
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #475569; }
        .form-control {
            width: 100%; padding: 10px 12px; font-size: 14px; color: var(--text-color);
            border: 1px solid #cbd5e1; border-radius: 8px; outline: none; background: white;
            transition: all 0.2s;
        }
        .form-control:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .time-range { display: flex; gap: 8px; align-items: center; }

        .multi-date-box {
            border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; max-height: 120px;
            overflow-y: auto; background: #ffffff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); margin-bottom: 6px;
        }
        .date-chip-item {
            display: flex; align-items: center; justify-content: space-between; background: #e2e8f0;
            padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 4px; font-weight: 500; color: #334155;
        }
        .date-chip-delete { color: #ef4444; cursor: pointer; font-weight: bold; margin-left: 8px; font-size: 14px; }
        .date-chip-delete:hover { color: #b91c1c; }
        .date-adder-row { display: flex; gap: 6px; }

        /* 房间特定样式颜色 */
        select#room option[value="need_book"] { background-color: var(--color-need-book); color: var(--color-need-book-text); }
        select#room option[value="23_meet"] { background-color: var(--color-23-meet); color: var(--color-23-meet-text); }
        select#room option[value="23_chat"] { background-color: var(--color-23-chat); color: var(--color-23-chat-text); }
        select#room option[value="27_meet"] { background-color: var(--color-27-meet); color: var(--color-27-meet-text); }
        select#room option[value="27_chat"] { background-color: var(--color-27-chat); color: var(--color-27-chat-text); }
        select#room option[value="28_meet"] { background-color: var(--color-28-meet); color: var(--color-28-meet-text); }
        select#room option[value="28_chat"] { background-color: var(--color-28-chat); color: var(--color-28-chat-text); }
        select#room option[value="32_road"] { background-color: var(--color-32-road); color: var(--color-32-road-text); }

        .btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); color: white;
            border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }
        .btn:hover { background: linear-gradient(135deg, #1d4ed8 0%, #1d4ed8 100%); transform: translateY(-1px); box-shadow: 0 6px 8px -1px rgba(37, 99, 235, 0.3); }

        /* ==========================================================================
           3. 右侧日历主面板
           ========================================================================= */
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; padding: 24px; background: #f8fafc; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-title { font-size: 24px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }
        .nav-buttons { display: flex; gap: 6px; }
        .nav-buttons button { 
            padding: 8px 16px; border: 1px solid #cbd5e1; background: white; cursor: pointer; 
            border-radius: 6px; font-size: 13px; font-weight: 600; color: #475569; transition: all 0.2s;
        }
        .nav-buttons button:hover { background: #edf2f7; color: var(--primary-light); border-color: #94a3b8; }

        .weekdays {
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
            font-weight: 700; color: #64748b; font-size: 14px; padding-bottom: 10px;
        }
        .days-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr);
            flex: 1; background-color: #e2e8f0; gap: 1px; border: 1px solid #cbd5e1; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .day-cell {
            background-color: white; padding: 6px; display: flex; flex-direction: column;
            cursor: pointer; position: relative; overflow: hidden; transition: all 0.15s ease;
        }
        .day-cell:hover { background-color: #f1f5f9; z-index: 2; box-shadow: inset 0 0 0 2px var(--primary-light); }
        .day-cell.other-month { background-color: #f1f5f9; color: #94a3b8; opacity: 0.6; }
        .day-cell.today { background-color: #eff6ff; }
        .day-cell.today .day-number { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 2px 4px rgba(37,99,235,0.3); }

        .day-number { font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #334155; }
        .cell-events-container { display: flex; flex-direction: column; gap: 3px; flex: 1; overflow: hidden; }

        .event-tag {
            font-size: 11px; padding: 2px 6px; border-radius: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; font-weight: 600;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .day-cell.status-need-book { background-color: var(--color-need-book) !important; }
        .day-cell.status-need-book .day-number { color: var(--color-need-book-text); }

        /* 各种标签颜色 */
        .tag-need_book { background-color: #fee2e2; color: #991b1b; border-left: 3px solid #ef4444; }
        .tag-23_meet { background-color: var(--color-23-meet); color: var(--color-23-meet-text); border-left: 3px solid #3b82f6; }
        .tag-23_chat { background-color: var(--color-23-chat); color: var(--color-23-chat-text); border-left: 3px solid #10b981; }
        .tag-27_meet { background-color: var(--color-27-meet); color: var(--color-27-meet-text); border-left: 3px solid #22c55e; }
        .tag-27_chat { background-color: var(--color-27-chat); color: var(--color-27-chat-text); border-left: 3px solid #a855f7; }
        .tag-28_meet { background-color: var(--color-28-meet); color: var(--color-28-meet-text); border-left: 3px solid #64748b; }
        .tag-28_chat { background-color: var(--color-28-chat); color: var(--color-28-chat-text); border-left: 3px solid #0284c7; }
        .tag-32_road { background-color: var(--color-32-road); color: var(--color-32-road-text); border-left: 3px solid #f97316; }
        .tag-custom_room { background-color: var(--color-custom); color: var(--color-custom-text); border-left: 3px solid #475569; border: 1px solid #cbd5e1; }

        /* ==========================================================================
           4. 智能流转模态弹窗
           ========================================================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6);
            display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 999;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: white; border-radius: 12px; width: 560px; max-width: 90%; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15); border: 1px solid #e2e8f0; animation: modalSlide 0.2s ease-out; }
        
        @keyframes modalSlide { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { padding: 18px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-top-left-radius: 12px; border-top-right-radius: 12px;}
        .modal-header h3 { font-size: 16px; font-weight: 700; color: #0f172a; }
        .close-btn { font-size: 26px; cursor: pointer; border: none; background: none; color: #94a3b8; transition: color 0.2s; }
        .close-btn:hover { color: #475569; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; background: #f8fafc; }

        .detail-item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-bottom: 14px; position: relative; background: #ffffff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .detail-item-time { font-size: 13px; color: #64748b; font-weight: 700; display: flex; align-items: center; gap: 4px; }
        .detail-item-title { font-size: 15px; font-weight: 700; margin: 6px 0; color: #1e293b; }
        .detail-item-meta { font-size: 12px; display: inline-block; padding: 3px 8px; border-radius: 6px; margin-top: 4px; font-weight: 600; }
        .detail-item-memo { font-size: 12px; color: #475569; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; margin-top: 10px; border-left: 3px solid #cbd5e1;}

        .action-bar { display: flex; gap: 8px; margin-top: 14px; border-top: 1px dashed #e2e8f0; padding-top: 12px; justify-content: flex-end; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; border: none; transition: all 0.2s;}
        .btn-delete { background: #fee2e2; color: #991b1b; }
        .btn-delete:hover { background: #fca5a5; transform: translateY(-1px); }
        .btn-convert { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .btn-convert:hover { background: #dbeafe; transform: translateY(-1px); }

        .quick-convert-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.01); }
        .quick-convert-row { display: flex; gap: 8px; align-items: center; }
        
        .no-data { text-align: center; color: #94a3b8; padding: 30px 0; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>会议室排课看板 🚀</h2>
            <p>数据双保险版：支持28楼扩展与全量自定义房间</p>
            
            <div class="backup-toolbar">
                <button class="btn-backup" onclick="exportData()">📤 导出备份(下载文件)</button>
                <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 导入恢复数据</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(this)">
            </div>
        </div>
        
        <div class="form-container">
            <form id="bookingForm">
                <div class="form-group">
                    <label>选择排课日期（可多选批量派课）*</label>
                    <div class="multi-date-box" id="selectedDatesContainer"></div>
                    <div class="date-adder-row">
                        <input type="date" id="dateInput" class="form-control" style="flex: 1;">
                        <button type="button" class="btn" style="width: auto; padding: 0 16px; font-size: 13px;" onclick="addDateToList()">＋ 添加</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>时间段 *</label>
                    <div class="time-range">
                        <input type="time" id="startTime" class="form-control" required value="09:00">
                        <span style="color: #94a3b8; font-weight: bold;">至</span>
                        <input type="time" id="endTime" class="form-control" required value="10:30">
                    </div>
                </div>

                <div class="form-group">
                    <label for="room">楼层与房间 *</label>
                    <select id="room" class="form-control" required onchange="toggleCustomRoom(this.value)">
                        <option value="need_book">⚠️ 需要预定！（未定房号）</option>
                        <option value="23_meet">🏢 23楼：会议室</option>
                        <option value="23_chat">🏢 23楼：洽谈室</option>
                        <option value="27_meet">🏢 27楼：会议室</option>
                        <option value="27_chat">🏢 27楼：洽谈室</option>
                        <option value="28_meet">🏢 28楼：会议室</option>
                        <option value="28_chat">🏢 28楼：洽谈室</option>
                        <option value="32_road">🏛️ 32楼：路演厅</option>
                        <option value="CUSTOM_ROOM" style="color: #2563eb; font-weight: bold;">➕ 手动填写其他房间...</option>
                    </select>
                </div>

                <div class="form-group" id="customRoomGroup" style="display: none;">
                    <label for="customRoomName">手动输入空间/房间名 *</label>
                    <input type="text" id="customRoomName" class="form-control" placeholder="例如：29楼多功能厅">
                </div>

                <div class="form-group">
                    <label for="purposeSelect">用途类型 *</label>
                    <select id="purposeSelect" class="form-control" onchange="toggleCustomPurpose(this.value)">
                        <option value="新员工第一课">新员工第一课</option>
                        <option value="新员工政策宣导">新员工政策宣导</option>
                        <option value="APN宣讲">APN宣讲</option>
                        <option value="IPG 1.0">IPG 1.0</option>
                        <option value="IPG领航者计划">IPG领航者计划</option>
                        <option value="IPG 2.0">IPG 2.0</option>
                        <option value="CUSTOM">➕ 手动填写其他用途...</option>
                    </select>
                </div>

                <div class="form-group" id="customPurposeGroup" style="display: none;">
                    <label for="customPurpose">手动输入用途 *</label>
                    <input type="text" id="customPurpose" class="form-control" placeholder="请输入具体课程或会议名称">
                </div>

                <div class="form-group">
                    <label for="memo">备注信息</label>
                    <textarea id="memo" class="form-control" rows="2" placeholder="讲师、设备等特殊诉求..."></textarea>
                </div>

                <button type="submit" class="btn">一键保存 / 批量排课</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div class="calendar-header">
            <div class="calendar-title" id="calendarTitle">2026年 05月</div>
            <div class="nav-buttons">
                <button onclick="changeMonth(-1)">上个月</button>
                <button onclick="toToday()">今天</button>
                <button onclick="changeMonth(1)">下个月</button>
            </div>
        </div>
        
        <div class="weekdays">
            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalDateTitle">预定清单详情</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        // 静态映射基础数据库
        const BASE_ROOM_MAP = {
            'need_book': { name: '⚠️待预定', class: 'tag-need_book', bgVar: '--color-need-book' },
            '23_meet': { name: '23F 会议室', class: 'tag-23_meet', bgVar: '--color-23-meet' },
            '23_chat': { name: '23F 洽谈室', class: 'tag-23_chat', bgVar: '--color-23-chat' },
            '27_meet': { name: '27F 会议室', class: 'tag-27_meet', bgVar: '--color-27-meet' },
            '27_chat': { name: '27F 洽谈室', class: 'tag-27_chat', bgVar: '--color-27-chat' },
            '28_meet': { name: '28F 会议室', class: 'tag-28_meet', bgVar: '--color-28-meet' },
            '28_chat': { name: '28F 洽谈室', class: 'tag-28_chat', bgVar: '--color-28-chat' },
            '32_road': { name: '32F 路演厅', class: 'tag-32_road', bgVar: '--color-32-road' }
        };

        const DB_KEY = 'ipro_calendar_v2_secure_store';
        const CUSTOM_ROOMS_KEY = 'ipro_calendar_custom_rooms';
        
        let currentDate = new Date();
        let bookings = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let customRooms = JSON.parse(localStorage.getItem(CUSTOM_ROOMS_KEY)) || []; // 用户创建的增量房间名数组
        let activeBatchDates = []; 

        // 动态获取合并后的全量房间配置字典
        function getFullRoomMap() {
            const map = { ...BASE_ROOM_MAP };
            customRooms.forEach(roomName => {
                map[roomName] = { name: roomName, class: 'tag-custom_room', bgVar: '--color-custom' };
            });
            return map;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const todayStr = new Date().toISOString().split('T')[0];
            activeBatchDates.push(todayStr);
            refreshDateChips();
            syncRoomDropdowns();
            renderCalendar();
        });

        // 动态刷新表单中所有的房间下拉菜单（支持动态写入自定义历史数据）
        function syncRoomDropdowns() {
            const roomSelect = document.getElementById('room');
            
            // 保留固定的前几项加上最后一项
            const valuesToKeep = ['need_book','23_meet','23_chat','27_meet','27_chat','28_meet','28_chat','32_road','CUSTOM_ROOM'];
            Array.from(roomSelect.options).forEach(opt => {
                if(!valuesToKeep.includes(opt.value)) {
                    roomSelect.removeChild(opt);
                }
            });

            // 逆向插在“手动填写”前面
            customRooms.forEach(roomName => {
                const opt = document.createElement('option');
                opt.value = roomName;
                opt.innerText = `⚙️ 自定义：${roomName}`;
                roomSelect.insertBefore(opt, roomSelect.options[roomSelect.options.length - 1]);
            });
        }

        // 📤 备份数据导出
        function exportData() {
            if (bookings.length === 0) return alert("当前没有任何排课数据，无需导出。");
            const payload = {
                bookings: bookings,
                customRooms: customRooms
            };
            const dataStr = JSON.stringify(payload, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `会议室全量备份数据_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 📥 备份数据导入
        function importData(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && (Array.isArray(imported.bookings) || Array.isArray(imported))) {
                        if (Array.isArray(imported)) {
                            bookings = imported; 
                        } else {
                            bookings = imported.bookings || [];
                            customRooms = imported.customRooms || [];
                        }
                        localStorage.setItem(DB_KEY, JSON.stringify(bookings));
                        localStorage.setItem(CUSTOM_ROOMS_KEY, JSON.stringify(customRooms));
                        syncRoomDropdowns();
                        renderCalendar();
                        alert(`🎉 成功恢复数据记录！`);
                    } else {
                        alert("导入失败：文件格式不符合规范。");
                    }
                } catch (err) {
                    alert("导入出现错误，请确保文件未损坏。");
                }
                input.value = ''; 
            };
            reader.readAsText(file);
        }

        function refreshDateChips() {
            const container = document.getElementById('selectedDatesContainer');
            container.innerHTML = '';
            if(activeBatchDates.length === 0) {
                container.innerHTML = '<span style="color: #94a3b8; font-size: 12px; font-weight: 500;">暂无日期，请在下方选择并添加</span>';
                return;
            }
            activeBatchDates.sort().forEach(d => {
                const chip = document.createElement('div');
                chip.className = 'date-chip-item';
                chip.innerHTML = `<span>📅 ${d}</span><span class="date-chip-delete" onclick="removeDateFromList('${d}')">×</span>`;
                container.appendChild(chip);
            });
        }

        function addDateToList() {
            const input = document.getElementById('dateInput');
            if(!input.value) return alert('请先选择一个合法日期！');
            if(activeBatchDates.includes(input.value)) return alert('该日期已在列表中。');
            activeBatchDates.push(input.value);
            refreshDateChips();
            input.value = '';
        }

        function removeDateFromList(dateStr) {
            activeBatchDates = activeBatchDates.filter(d => d !== dateStr);
            refreshDateChips();
        }

        function toggleCustomRoom(value) {
            const group = document.getElementById('customRoomGroup');
            const input = document.getElementById('customRoomName');
            if (value === 'CUSTOM_ROOM') {
                group.style.display = 'block';
                input.required = true;
            } else {
                group.style.display = 'none';
                input.required = false;
            }
        }

        function toggleCustomPurpose(value) {
            const group = document.getElementById('customPurposeGroup');
            const input = document.getElementById('customPurpose');
            if (value === 'CUSTOM') {
                group.style.display = 'block';
                input.required = true;
            } else {
                group.style.display = 'none';
                input.required = false;
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('calendarTitle').innerText = `${year}年 ${(month + 1).toString().padStart(2, '0')}月`;
            
            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevTotalDays - i;
                const prevMonth = month === 0 ? 11 : month - 1;
                const prevYear = month === 0 ? year - 1 : year;
                const dateStr = `${prevYear}-${(prevMonth + 1).toString().padStart(2, '0')}-${dayNum.toString().padStart(2, '0')}`;
                daysGrid.appendChild(createDayCell(dayNum, dateStr, true));
            }

            const todayObj = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
                const isToday = todayObj.getFullYear() === year && todayObj.getMonth() === month && todayObj.getDate() === day;
                daysGrid.appendChild(createDayCell(day, dateStr, false, isToday));
            }

            const totalRendered = firstDayIndex + totalDays;
            const nextMonthNeed = 42 - totalRendered;
            for (let day = 1; day <= nextMonthNeed; day++) {
                const nextMonth = month === 11 ? 0 : month + 1;
                const nextYear = month === 11 ? year + 1 : year;
                const dateStr = `${nextYear}-${(nextMonth + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
                daysGrid.appendChild(createDayCell(day, dateStr, true));
            }
        }

        function createDayCell(dayNum, dateStr, isOtherMonth, isToday = false) {
            const cell = document.createElement('div');
            cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`;
            cell.addEventListener('click', () => openModal(dateStr));

            const numberDiv = document.createElement('div');
            numberDiv.className = 'day-number';
            numberDiv.innerHTML = `${dayNum}`;
            cell.appendChild(numberDiv);

            const eventsContainer = document.createElement('div');
            eventsContainer.className = 'cell-events-container';

            const dayBookings = bookings
                .filter(b => b.date === dateStr)
                .sort((a, b) => a.startTime.localeCompare(b.startTime));

            const ROOM_MAP = getFullRoomMap();

            if (dayBookings.length > 0) {
                const hasNeedBook = dayBookings.some(b => b.room === 'need_book');
                if (hasNeedBook) {
                    cell.classList.add('status-need-book');
                } else {
                    const firstRoomType = dayBookings[0].room;
                    const roomConfig = ROOM_MAP[firstRoomType];
                    if (roomConfig) cell.style.backgroundColor = `var(${roomConfig.bgVar})`;
                }

                dayBookings.forEach(book => {
                    const tag = document.createElement('div');
                    const roomInfo = ROOM_MAP[book.room] || ROOM_MAP['need_book'];
                    tag.className = `event-tag ${roomInfo.class}`;
                    tag.innerText = `${book.startTime} ${roomInfo.name}-${book.purpose}`;
                    eventsContainer.appendChild(tag);
                });
            }

            cell.appendChild(eventsContainer);
            return cell;
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function toToday() {
            currentDate = new Date();
            renderCalendar();
        }

        // 表单保存数据
        document.getElementById('bookingForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if(activeBatchDates.length === 0) return alert('提交失败：请至少选择一个排课日期！');

            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const roomSelectValue = document.getElementById('room').value;
            const purposeSelect = document.getElementById('purposeSelect').value;
            const memo = document.getElementById('memo').value.trim();

            if (startTime >= endTime) return alert('时间差错：结束时间必须晚于开始时间！');

            // 1. 处理自定义房间的逻辑
            let finalRoomValue = roomSelectValue;
            if (roomSelectValue === 'CUSTOM_ROOM') {
                const customInputName = document.getElementById('customRoomName').value.trim();
                if (!customInputName) return alert('请输入自定义房间名称！');
                
                // 如果是新输入的空间名字，追加进本地并刷新下拉菜单
                if (!customRooms.includes(customInputName)) {
                    customRooms.push(customInputName);
                    localStorage.setItem(CUSTOM_ROOMS_KEY, JSON.stringify(customRooms));
                    syncRoomDropdowns();
                }
                finalRoomValue = customInputName;
            }

            // 2. 处理用途
            let finalPurpose = purposeSelect;
            if (purposeSelect === 'CUSTOM') {
                finalPurpose = document.getElementById('customPurpose').value.trim();
                if (!finalPurpose) return alert('请输入自定义用途名称！');
            }

            // 3. 批量写入
            activeBatchDates.forEach(date => {
                bookings.push({
                    id: `${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
                    date, startTime, endTime, memo,
                    room: finalRoomValue,
                    purpose: finalPurpose
                });
            });

            localStorage.setItem(DB_KEY, JSON.stringify(bookings));
            alert(`成功为这 ${activeBatchDates.length} 个日期批量登记！`);
            
            document.getElementById('memo').value = '';
            document.getElementById('bookingForm').reset();
            toggleCustomRoom('');
            toggleCustomPurpose('');
            syncRoomDropdowns();
            renderCalendar();
        });

        // 弹窗看板和智能快捷转换
        function openModal(dateStr) {
            document.getElementById('modalDateTitle').innerText = `📅 ${dateStr} 场地看板详情与指派`;
            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const dayBookings = bookings
                .filter(b => b.date === dateStr)
                .sort((a, b) => a.startTime.localeCompare(b.startTime));

            const ROOM_MAP = getFullRoomMap();

            if (dayBookings.length === 0) {
                body.innerHTML = '<div class="no-data">当天无任何排课及场地安排记录。</div>';
            } else {
                dayBookings.forEach(b => {
                    const roomInfo = ROOM_MAP[b.room] || { name: b.room, class: 'tag-custom_room' };
                    const item = document.createElement('div');
                    item.className = 'detail-item';
                    
                    let actionHtml = '';
                    if(b.room === 'need_book') {
                        // 快捷指派区域：动态填充已有全量选项
                        let optionsHtml = '';
                        Object.keys(ROOM_MAP).forEach(k => {
                            if(k !== 'need_book') {
                                optionsHtml += `<option value="${k}">${ROOM_MAP[k].name}</option>`;
                            }
                        });

                        actionHtml = `
                            <div class="quick-convert-box" id="convert-box-${b.id}">
                                <span style="font-size: 12px; font-weight: bold; color: #1e3a8a;">⚡ 一键指派或分配房间：</span>
                                <div class="quick-convert-row">
                                    <select class="form-control" id="select-convert-${b.id}" style="padding:4px 8px; font-size:12px; height: 28px; border-radius: 6px; flex:1;">
                                        ${optionsHtml}
                                    </select>
                                    <button class="btn-sm btn-convert" onclick="executeQuickConvert('${b.id}', '${dateStr}')">确认指派</button>
                                    <button class="btn-sm btn-delete" style="background:#e2e8f0; color:#334155;" onclick="deleteBooking('${b.id}', '${dateStr}', true)">取消</button>
                                </div>
                            </div>
                        `;
                    } else {
                        actionHtml = `
                            <div class="action-bar">
                                <button class="btn-sm btn-delete" onclick="deleteBooking('${b.id}', '${dateStr}')">释放并删除</button>
                            </div>
                        `;
                    }

                    item.innerHTML = `
                        <div class="detail-item-time">⏰ 时段：${b.startTime} - ${b.endTime}</div>
                        <div class="detail-item-title">📋 项目用途：${b.purpose}</div>
                        <span class="detail-item-meta ${roomInfo.class}">📍 状态/空间：${roomInfo.name}</span>
                        ${b.memo ? `<div class="detail-item-memo"><strong>📝 备注：</strong>${b.memo}</div>` : ''}
                        ${actionHtml}
                    `;
                    body.appendChild(item);
                });
            }
            document.getElementById('modalOverlay').classList.add('active');
        }

        function executeQuickConvert(id, dateStr) {
            const selectEl = document.getElementById(`select-convert-${id}`);
            const chosenRoom = selectEl.value;
            const target = bookings.find(b => b.id === id);
            if(target) {
                target.room = chosenRoom;
                localStorage.setItem(DB_KEY, JSON.stringify(bookings));
                openModal(dateStr);
                renderCalendar();
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function deleteBooking(id, dateStr, isSilent = false) {
            const msg = isSilent ? '确定取消吗？' : '确认要删除并释放这条场地预定记录吗？';
            if (confirm(msg)) {
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem(DB_KEY, JSON.stringify(bookings));
                openModal(dateStr);
                renderCalendar();
            }
        }
    </script>
</body>
</html>
